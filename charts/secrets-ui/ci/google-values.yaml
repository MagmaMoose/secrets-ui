# Google Workspace sign-in with HashiCorp Vault and OCI Vault, for CI's lint and render.
signIn: google
google:
  clientId: 1234-abc.apps.googleusercontent.com
  clientSecret:
    existingSecret: secrets-ui-google
  domains: [example.com]
config:
  publicOrigin: https://secrets.example.com
providers:
  hashicorpVault:
    enabled: true
    address: https://vault.example.com:8200
    stores:
      - name: team-a-vault-dev
        mount: secret
        path: dev/team-a
  ociVault:
    enabled: true
    region: eu-amsterdam-1
    domainUrl: https://idcs-0000.identity.oraclecloud.com
    clientId: secrets-ui
    clientSecret:
      existingSecret: secrets-ui-oci
    stores:
      - name: team-a-oci-dev
        compartment: ocid1.compartment.oc1..aaaa
        vault: ocid1.vault.oc1.eu-amsterdam-1.aaaa
        key: ocid1.key.oc1.eu-amsterdam-1.aaaa.bbbb
