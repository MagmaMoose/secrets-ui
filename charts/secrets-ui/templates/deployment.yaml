{{- $origin := required "config.publicOrigin is required, such as https://secrets.example.com" .Values.config.publicOrigin }}
{{- $entra := eq .Values.signIn "entra" }}
{{- if $entra }}
{{- $_ := required "azure.tenantId is required" .Values.azure.tenantId }}
{{- $_ := required "azure.clientId is required" .Values.azure.clientId }}
{{- if and (not .Values.azure.workloadIdentity.enabled) (not .Values.azure.clientSecret.existingSecret) }}
{{- fail "set azure.workloadIdentity.enabled, or azure.clientSecret.existingSecret" }}
{{- end }}
{{- else if eq .Values.signIn "google" }}
{{- $_ := required "google.clientId is required" .Values.google.clientId }}
{{- $_ := required "google.clientSecret.existingSecret is required" .Values.google.clientSecret.existingSecret }}
{{- if not .Values.google.domains }}
{{- fail "google.domains must list the Workspace domains whose accounts may sign in" }}
{{- end }}
{{- else }}
{{- fail "signIn takes entra or google" }}
{{- end }}
{{- $providers := list }}
{{- if and $entra .Values.providers.azureKeyVault.enabled }}{{ $providers = append $providers "azure-keyvault" }}{{ end }}
{{- $vault := .Values.providers.hashicorpVault }}
{{- if $vault.enabled }}
{{- $providers = append $providers "hashicorp-vault" }}
{{- if not $vault.stores }}
{{- fail "providers.hashicorpVault.stores must list at least one store" }}
{{- end }}
{{- end }}
{{- $oci := .Values.providers.ociVault }}
{{- if $oci.enabled }}
{{- $providers = append $providers "oci-vault" }}
{{- if not $oci.stores }}
{{- fail "providers.ociVault.stores must list at least one store" }}
{{- end }}
{{- end }}
{{- if not $providers }}
{{- fail "enable at least one of providers.*" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "secrets-ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secrets-ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "secrets-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "secrets-ui.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.podAnnotations (and $vault.enabled $vault.caBundle) }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if and $vault.enabled $vault.caBundle }}
        # The app reads the CA at startup, so a new one rolls the pods.
        checksum/vault-ca: {{ $vault.caBundle | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "secrets-ui.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      {{- else if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
          {{- with .Values.topologySpread.nodeTaintsPolicy }}
          nodeTaintsPolicy: {{ . }}
          {{- end }}
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              {{- include "secrets-ui.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
        - name: secrets-ui
          image: {{ include "secrets-ui.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SECRETS_UI_SIGN_IN
              value: {{ .Values.signIn | quote }}
            {{- if $entra }}
            - name: AZURE_TENANT_ID
              value: {{ .Values.azure.tenantId | quote }}
            - name: AZURE_CLIENT_ID
              value: {{ .Values.azure.clientId | quote }}
            {{- with .Values.azure.authorityHost }}
            - name: AZURE_AUTHORITY_HOST
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.azure.workloadIdentity.enabled }}
            - name: AZURE_FEDERATED_TOKEN_FILE
              value: /var/run/secrets/azure/tokens/azure-identity-token
            {{- else }}
            # A mounted file rather than an env var: an environment variable is readable in
            # /proc/<pid>/environ and inherited by child processes.
            - name: AZURE_CLIENT_SECRET_FILE
              value: /etc/secrets-ui/client/{{ .Values.azure.clientSecret.key }}
            {{- end }}
            {{- else }}
            - name: GOOGLE_CLIENT_ID
              value: {{ .Values.google.clientId | quote }}
            - name: GOOGLE_CLIENT_SECRET_FILE
              value: /etc/secrets-ui/client/{{ .Values.google.clientSecret.key }}
            - name: SECRETS_UI_GOOGLE_DOMAINS
              value: {{ join "," .Values.google.domains | quote }}
            {{- end }}
            - name: SECRETS_UI_PUBLIC_ORIGIN
              value: {{ $origin | quote }}
            - name: SECRETS_UI_PROVIDERS
              value: {{ join "," $providers | quote }}
            {{- with .Values.providers.azureKeyVault }}
            {{- if and $entra .enabled }}
            - name: SECRETS_UI_AZURE_KEYVAULT_ROLES
              value: {{ .roles | quote }}
            - name: SECRETS_UI_AZURE_KEYVAULT_SUFFIX
              value: {{ .suffix | quote }}
            {{- with .stores }}
            - name: SECRETS_UI_AZURE_KEYVAULT_STORES
              value: {{ toJson . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if $vault.enabled }}
            - name: SECRETS_UI_HASHICORP_VAULT_ADDR
              value: {{ required "providers.hashicorpVault.address is required, such as https://vault.example.com:8200" $vault.address | quote }}
            - name: SECRETS_UI_HASHICORP_VAULT_AUTH_MOUNT
              value: {{ $vault.authMount | quote }}
            - name: SECRETS_UI_HASHICORP_VAULT_AUTH_ROLE
              value: {{ $vault.authRole | quote }}
            - name: SECRETS_UI_HASHICORP_VAULT_STORES
              value: {{ toJson $vault.stores | quote }}
            {{- if $vault.caBundle }}
            - name: SECRETS_UI_HASHICORP_VAULT_CA_FILE
              value: /etc/secrets-ui/vault-ca/ca.crt
            {{- end }}
            {{- end }}
            {{- if $oci.enabled }}
            - name: SECRETS_UI_OCI_REGION
              value: {{ required "providers.ociVault.region is required, such as eu-amsterdam-1" $oci.region | quote }}
            - name: SECRETS_UI_OCI_DOMAIN_URL
              value: {{ required "providers.ociVault.domainUrl is required" $oci.domainUrl | quote }}
            - name: SECRETS_UI_OCI_CLIENT_ID
              value: {{ required "providers.ociVault.clientId is required" $oci.clientId | quote }}
            - name: SECRETS_UI_OCI_CLIENT_SECRET_FILE
              value: /etc/secrets-ui/oci/{{ $oci.clientSecret.key }}
            - name: SECRETS_UI_OCI_STORES
              value: {{ toJson $oci.stores | quote }}
            {{- end }}
            - name: SECRETS_UI_SESSION_HOURS
              value: {{ .Values.config.sessionHours | quote }}
            - name: SECRETS_UI_SESSION_KEY_FILE
              value: /etc/secrets-ui/session/{{ .Values.session.key }}
            {{- range $key, $env := dict "accent" "ACCENT" "accentText" "ACCENT_TEXT" "accentDark" "ACCENT_DARK" "accentTextDark" "ACCENT_TEXT_DARK" }}
            {{- with index $.Values.branding $key }}
            - name: SECRETS_UI_BRAND_{{ $env }}
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: session
              mountPath: /etc/secrets-ui/session
              readOnly: true
            {{- if and $entra .Values.azure.workloadIdentity.enabled }}
            - name: azure-identity-token
              mountPath: /var/run/secrets/azure/tokens
              readOnly: true
            {{- else }}
            - name: client-secret
              mountPath: /etc/secrets-ui/client
              readOnly: true
            {{- end }}
            {{- if and $vault.enabled $vault.caBundle }}
            - name: vault-ca
              mountPath: /etc/secrets-ui/vault-ca
              readOnly: true
            {{- end }}
            {{- if $oci.enabled }}
            - name: oci-client-secret
              mountPath: /etc/secrets-ui/oci
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: session
          secret:
            secretName: {{ include "secrets-ui.sessionSecret" . }}
            defaultMode: 0440
            items:
              - key: {{ .Values.session.key }}
                path: {{ .Values.session.key }}
        {{- if and $entra .Values.azure.workloadIdentity.enabled }}
        # The service-account token Entra ID exchanges through the federated credential. The
        # kubelet renews it in place before it expires; the app reads the file on every use.
        - name: azure-identity-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: azure-identity-token
                  audience: {{ .Values.azure.workloadIdentity.audience }}
                  expirationSeconds: 3600
        {{- else }}
        {{- $secret := ternary .Values.azure.clientSecret .Values.google.clientSecret $entra }}
        - name: client-secret
          secret:
            secretName: {{ $secret.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ $secret.key }}
                path: {{ $secret.key }}
        {{- end }}
        {{- if and $vault.enabled $vault.caBundle }}
        - name: vault-ca
          configMap:
            name: {{ include "secrets-ui.fullname" . }}-vault-ca
        {{- end }}
        {{- if $oci.enabled }}
        - name: oci-client-secret
          secret:
            secretName: {{ required "providers.ociVault.clientSecret.existingSecret is required" $oci.clientSecret.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ $oci.clientSecret.key }}
                path: {{ $oci.clientSecret.key }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
