# secrets-ui. Required: azure.tenantId, azure.clientId and config.publicOrigin.
# The app registration setup is in the repository README.

replicaCount: 2

image:
  repository: ghcr.io/magmamoose/secrets-ui
  # Defaults to the chart's appVersion.
  tag: ""
  # sha256:..., pins the image whatever the tag says.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Who people sign in with: entra (Entra ID) or google (Google Workspace). Azure Key Vault takes
# Entra ID tokens only, so it is off with google.
signIn: entra

azure:
  # The Entra ID tenant (a GUID) and the app registration's client id.
  tenantId: ""
  clientId: ""
  # Leave empty for the public cloud (https://login.microsoftonline.com).
  authorityHost: ""
  # The app authenticates with its own service-account token, which Entra ID accepts through a
  # federated credential (issuer: the cluster's service-account issuer, subject:
  # system:serviceaccount:<namespace>:<service account>). No secret to store or rotate.
  workloadIdentity:
    enabled: true
    audience: api://AzureADTokenExchange
  # Used instead when workloadIdentity.enabled is false: a Secret holding a client secret.
  clientSecret:
    existingSecret: ""
    key: client-secret

# With signIn: google. The OAuth client (type Web application), a Secret holding its client
# secret, and the Workspace domains whose accounts may sign in.
google:
  clientId: ""
  clientSecret:
    existingSecret: ""
    key: client-secret
  domains: []

config:
  # Where people open the UI, scheme and host only. The redirect URI to register on the app
  # is <publicOrigin>/auth/callback.
  publicOrigin: ""
  # How long a sign-in lasts, 1 to 24.
  sessionHours: 8

# Your colours, as quoted "#rrggbb"; empty keeps the default. The accent fills buttons, links, the
# selected store and the logo; accentText is the text on it. The dark ones default to these two.
branding:
  accent: ""
  accentText: ""
  accentDark: ""
  accentTextDark: ""

# The secret stores. Each store a person sees comes from an app role on their sign-in.
providers:
  azureKeyVault:
    enabled: true
    # A regular expression an app role value must match, as a whole, to count as a vault name.
    # Use it to keep privileged vaults out even if a role for one is assigned.
    roles: ".+"
    # The Key Vault DNS suffix: vault.azure.net, or a sovereign cloud's.
    suffix: vault.azure.net
    # How vaults show in the UI. Listed vaults come first, in this order, under their label
    # (default: the vault name); the rest follow by name. A resource_id shows the vault's audit
    # log (see the README). Listing a vault grants nobody access.
    stores: []
    #  - name: team-a-keyvault-dev
    #    label: team-a-dev
    #    resource_id: /subscriptions/<id>/resourceGroups/<group>/providers/Microsoft.KeyVault/vaults/team-a-keyvault-dev
    #    # The External Secrets store the Kustomize example uses; default: a ClusterSecretStore
    #    # named after the vault. SecretStore/<name> for a namespaced one.
    #    secret_store: team-a-keyvault-dev
  hashicorpVault:
    enabled: false
    # Where Vault listens, such as https://vault.example.com:8200.
    address: ""
    # The JWT auth mount and role that sign people in to Vault with their Entra ID token (see the
    # README).
    authMount: jwt
    authRole: secrets-ui
    # PEM certificate(s) of the private CA that signed Vault's certificate; empty trusts the public
    # CAs. Only the calls to Vault trust it.
    caBundle: ""
    # One store per folder in a KV v2 mount, in the order to show them in. A person sees a store
    # when one of their app roles is its name; keep these names out of azureKeyVault.roles.
    stores: []
    #  - name: team-a-vault-dev
    #    label: team-a-dev
    #    mount: secret
    #    path: dev/team-a
    #    secret_store: vault

session:
  # A Secret holding the key that seals session cookies (at least 32 characters), shared by
  # every replica. Empty: the chart creates one on install and keeps it on upgrade.
  existingSecret: ""
  key: session-key

serviceAccount:
  create: true
  # Defaults to the release's full name. It is the subject of the federated credential.
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Defaults to the host of config.publicOrigin.
  host: ""
  tls:
    # The TLS Secret for the host; empty for no tls block.
    secretName: ""

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# One replica per node where possible. DoNotSchedule makes it strict.
topologySpread:
  enabled: true
  whenUnsatisfiable: ScheduleAnyway
  # Honor keeps tainted nodes out of the count; empty leaves the Kubernetes default.
  nodeTaintsPolicy: ""
# Or your own constraints, rendered as they are instead of the one above.
topologySpreadConstraints: []

networkPolicy:
  # Ingress to the http port from ingressFrom (any pod when empty); egress to DNS and to public
  # addresses on 443 (Entra ID, the vaults and Log Analytics).
  enabled: false
  ingressFrom: []
  # More egress rules, rendered as they are: a Vault on a private address needs one.
  extraEgress: []

resources:
  requests:
    cpu: 10m
    memory: 96Mi
  limits:
    memory: 256Mi

priorityClassName: ""
podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
extraEnv: []
