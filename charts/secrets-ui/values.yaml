# secrets-ui. Required: azure.tenantId, azure.clientId and config.publicOrigin.
# The app registration setup is in the repository README.

replicaCount: 2

image:
  repository: ghcr.io/magmamoose/secrets-ui
  # Defaults to the chart's appVersion.
  tag: ""
  # sha256:..., pins the image whatever the tag says.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

azure:
  # The Entra ID tenant (a GUID) and the app registration's client id.
  tenantId: ""
  clientId: ""
  # Leave empty for the public cloud (https://login.microsoftonline.com).
  authorityHost: ""
  # The app authenticates with its own service-account token, which Entra ID accepts through a
  # federated credential (issuer: the cluster's service-account issuer, subject:
  # system:serviceaccount:<namespace>:<service account>). No secret to store or rotate.
  workloadIdentity:
    enabled: true
    audience: api://AzureADTokenExchange
  # Used instead when workloadIdentity.enabled is false: a Secret holding a client secret.
  clientSecret:
    existingSecret: ""
    key: client-secret

config:
  # Where people open the UI, scheme and host only. The redirect URI to register on the app
  # is <publicOrigin>/auth/callback.
  publicOrigin: ""
  # How long a sign-in lasts, 1 to 24.
  sessionHours: 8

# The secret stores. Each store a person sees comes from an app role on their sign-in.
providers:
  azureKeyVault:
    enabled: true
    # A regular expression an app role value must match, as a whole, to count as a vault name.
    # Use it to keep privileged vaults out even if a role for one is assigned.
    roles: ".+"
    # The Key Vault DNS suffix: vault.azure.net, or a sovereign cloud's.
    suffix: vault.azure.net

session:
  # A Secret holding the key that seals session cookies (at least 32 characters), shared by
  # every replica. Empty: the chart creates one on install and keeps it on upgrade.
  existingSecret: ""
  key: session-key

serviceAccount:
  create: true
  # Defaults to the release's full name. It is the subject of the federated credential.
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Defaults to the host of config.publicOrigin.
  host: ""
  tls:
    # The TLS Secret for the host; empty for no tls block.
    secretName: ""

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# One replica per node where possible. DoNotSchedule makes it strict.
topologySpread:
  enabled: true
  whenUnsatisfiable: ScheduleAnyway
  # Honor keeps tainted nodes out of the count; empty leaves the Kubernetes default.
  nodeTaintsPolicy: ""
# Or your own constraints, rendered as they are instead of the one above.
topologySpreadConstraints: []

networkPolicy:
  # Ingress to the http port from ingressFrom (any pod when empty); egress to DNS and to public
  # addresses on 443 (Entra ID and the vaults).
  enabled: false
  ingressFrom: []

resources:
  requests:
    cpu: 10m
    memory: 96Mi
  limits:
    memory: 256Mi

priorityClassName: ""
podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
extraEnv: []
