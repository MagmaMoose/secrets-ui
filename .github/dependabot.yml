# Versions wait 7 days after release before a PR proposes them, so a compromised or yanked
# release has time to be pulled. Security updates are exempt and arrive at once.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-version:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Transitive packages too, so a fix like certifi's lands without waiting on a security update.
    allow:
      - dependency-type: all
    groups:
      python:
        patterns: ["*"]
        # uv-build has no locked version; grouped with lock-only bumps, Dependabot skips the group.
        exclude-patterns: ["uv-build"]
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
